<!DOCTYPE html>
<html>
<head>
  <title>Viewport Simulator</title>
  <style>
    body { margin: 0; background: #171717; color: #e5e5e5; font-family: system-ui, sans-serif; height: 100vh; overflow: hidden; position: relative; }
    
    /* Full Screen Canvas */
    .canvas { 
      position: absolute; inset: 0; 
      display: flex; align-items: center; justify-content: center; 
      background-image: radial-gradient(#333 1px, transparent 1px); background-size: 20px 20px; 
      overflow: auto; z-index: 1;
    }
    
    .device-frame { background: white; transition: all 0.3s ease; box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.7); }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    
    .badge { 
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); 
      background: #262626; padding: 6px 16px; border-radius: 20px; 
      font-size: 12px; color: #a3a3a3; border: 1px solid #404040; 
      pointer-events: none; z-index: 10;
    }

    /* Floating Draggable Toolbar */
    .toolbar { 
      position: absolute; top: 20px; left: 20px; width: 300px; 
      background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(12px);
      border: 1px solid #404040; border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: flex; flex-direction: column; 
      z-index: 100; transition: width 0.3s ease, height 0.3s ease;
    }

    .toolbar.collapsed { width: auto; }
    .toolbar.collapsed .brand { display: none; }

    /* Header (Drag Handle) */
    .toolbar-header {
      padding: 12px 16px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid #404040;
      display: flex; align-items: center; justify-content: space-between;
      cursor: move; user-select: none;
      border-radius: 12px 12px 0 0;
    }
    
    .brand { font-weight: bold; font-size: 13px; text-transform: uppercase; color: #a3a3a3; display: flex; align-items: center; gap: 6px; }

    /* Header Controls (Collapse/MiniPlay) */
    .header-controls { display: flex; align-items: center; gap: 8px; }
    
    .btn-icon { background: transparent; border: none; color: #a3a3a3; cursor: pointer; padding: 4px; border-radius: 4px; }
    .btn-icon:hover { background: #404040; color: white; }

    /* Body (Collapsible) */
    .toolbar-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .toolbar.collapsed .toolbar-body { display: none; }
    .toolbar.collapsed .toolbar-header { border-bottom: none; border-radius: 12px; padding: 8px 12px; }

    /* Inputs */
    .control-group { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .control-group label { font-size: 11px; color: #737373; text-transform: uppercase; font-weight: bold; }
    
    input, select { background: #171717; border: 1px solid #404040; color: white; padding: 6px 10px; border-radius: 6px; font-size: 12px; width: 100%; box-sizing: border-box; }
    input:focus, select:focus { outline: none; border-color: #3b82f6; }

    /* Custom Select Style */
    select {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23a3a3a3%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 10px top 50%;
      background-size: 8px auto;
      padding-right: 24px;
    }

    /* Buttons */
    .btn-primary { background: #2563eb; border: none; font-weight: bold; cursor: pointer; padding: 10px; border-radius: 6px; color: white; width: 100%; margin-top: 4px; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-danger { background: #451a1a; color: #f87171; border: 1px solid #7f1d1d; cursor: pointer; padding: 10px; border-radius: 6px; width: 100%; margin-top: 4px; display: none; }
    
    /* Custom Dimensions */
    .custom-section { margin-top: 4px; padding-top: 12px; border-top: 1px solid #333; }
    .dual-input { display: flex; gap: 8px; margin-bottom: 8px; }
    .aspect-controls { display: flex; gap: 4px; }
    .btn-aspect { 
      flex: 1; font-size: 10px; padding: 6px; 
      background: #262626; border: 1px solid #404040; color: #a3a3a3; 
      cursor: pointer; border-radius: 4px; transition: all 0.2s;
    }
    .btn-aspect:hover { background: #333; color: white; border-color: #555; }

    /* Mini Play Button (Visible only when collapsed) */
    #miniPlayBtn { 
      display: none; padding: 4px 8px; font-size: 10px; background: #2563eb; 
      border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer;
    }
    #miniStopBtn {
      display: none; padding: 4px 8px; font-size: 10px; background: #451a1a; color: #f87171; 
      border: 1px solid #7f1d1d; border-radius: 4px; font-weight: bold; cursor: pointer;
    }

    .toolbar.collapsed #miniPlayBtn { display: block; }
    .toolbar.collapsed #miniStopBtn { display: none; } /* Managed by JS */
  </style>
</head>
<body>

  <!-- Floating Toolbar -->
  <div class="toolbar" id="toolbar">
    <div class="toolbar-header" id="dragHandle">
      <div class="brand"><span>⚡</span> Simulator</div>
      
      <div class="header-controls">
        <button id="miniPlayBtn">PLAY</button>
        <button id="miniStopBtn">STOP</button>
        <button id="collapseBtn" class="btn-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>
    </div>

    <div class="toolbar-body">
      <!-- Source -->
      <div class="control-group">
        <input type="text" id="urlInput" placeholder="Enter URL (https://...)">
      </div>
      
      <!-- Viewport -->
      <div class="control-group">
        <select id="preset">
          <option value="375x667">iPhone SE</option>
          <option value="393x852">iPhone 14 Pro</option>
          <option value="768x1024">iPad Mini</option>
          <option value="1280x800" selected>Laptop (13")</option>
          <option value="1920x1080">Desktop (1080p)</option>
        </select>
      </div>

      <!-- Custom Dimensions -->
      <div class="custom-section">
        <div class="dual-input">
           <input type="number" id="customWidth" placeholder="W">
           <input type="number" id="customHeight" placeholder="H">
        </div>
        <div class="aspect-controls">
          <button class="btn-aspect" data-ratio="1">1:1</button>
          <button class="btn-aspect" data-ratio="1.3333">4:3</button>
          <button class="btn-aspect" data-ratio="1.25">5:4</button>
        </div>
      </div>

      <hr style="border: 0; border-top: 1px solid #333; width: 100%; margin: 8px 0;">

      <!-- Timing Controls -->
      <div class="control-group">
        <label style="width: 40px;">Delay</label>
        <input type="number" id="delay" value="0.5" step="0.5" min="0">
      </div>

      <div class="control-group">
        <label style="width: 40px;">Speed</label>
        <input type="number" id="speed" value="10" min="1" max="50">
      </div>

      <div class="control-group">
        <label style="width: 40px;">Ease</label>
        <select id="easing">
          <option>Linear</option>
          <option>Ease In (Quad)</option>
          <option>Ease Out (Quad)</option>
          <option selected>Ease In Out (Quad)</option>
          <option>Ease In Out (Sine)</option>
        </select>
      </div>

      <!-- Target Controls -->
      <div class="control-group">
        <input type="text" id="startId" placeholder="Start Element ID (#)">
        <input type="text" id="endId" placeholder="End Element ID (#)">
      </div>
      
      <!-- Actions -->
      <button id="startBtn" class="btn-primary">PLAY SEQUENCE</button>
      <button id="stopBtn" class="btn-danger">STOP SEQUENCE</button>
    </div>
  </div>

  <!-- Canvas -->
  <div class="canvas" id="canvas">
    <div class="device-frame" id="frame" style="width: 1280px; height: 800px;">
      <iframe id="viewer" src=""></iframe>
    </div>
    <div class="badge" id="scaleBadge">Scale: 100%</div>
  </div>

  <script src="simulator.js"></script>
</body>
</html>
